name: Release

# Build native installers for all platforms and publish them to a GitHub
# Release. Two tracks (à la Deskflow):
#   - push to main        → "continuous" prerelease (always latest build)
#   - push a tag  v*      → a versioned, stable release
#   - workflow_dispatch   → build + upload artifacts only (no release)
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          # Yu 2026-09-20 18:53: dropped windows-latest from the
          # default matrix. GitHub's Windows runner stalled twice
          # today (35503439032, 35503708705) — first inside
          # `Build (tauri, Windows/Linux)` for 45+min, then inside
          # `Prepare payload (bridge dist + Node sidecar)`. Neither
          # timeout-minutes:25 on the Build step nor a full workflow
          # restart helped: it's a runner-side problem, not a
          # source problem. Ship macOS + Linux fast; trigger Windows
          # manually via `workflow_dispatch` when we actually need
          # a Windows installer (or add a nightly-only Windows
          # workflow later).
          # - os: windows-latest
          #   target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Linux: Tauri (WebKitGTK) system deps.
      - name: Linux deps
        if: matrix.os == 'ubuntu-22.04'
        run: |
          # GitHub runners preinstall Google Chrome's apt repo; when its
          # Packages.gz is updated mid-flight we hit "Hash Sum mismatch"
          # and apt-get update exits non-zero. We don't need chrome for
          # this build, so drop those source lists first.
          sudo rm -f /etc/apt/sources.list.d/google-chrome*.list \
                     /etc/apt/sources.list.d/google.list
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install app deps
        run: npm install

      - name: Prepare payload (bridge dist + Node sidecar)
        env:
          TARGET_TRIPLE: ${{ matrix.target }}
        run: node scripts/prepare-payload.mjs --node-version v22.14.0

      # Per-platform bundle targets. On macOS we build ONLY the .app
      # (no dmg): tauri deletes bundle/macos/*.app right after making the
      # dmg, which would wipe the app we need to re-sign + zip. We ship
      # the re-signed .app as a zip instead.
      - name: Build (tauri, macOS → app only)
        if: runner.os == 'macOS'
        timeout-minutes: 25
        run: npm run build -- --target ${{ matrix.target }} --bundles app

      - name: Build (tauri, Windows/Linux)
        if: runner.os != 'macOS'
        # Yu 2026-09-20 18:35: Windows runner has stalled on this step
        # for 45+ minutes before, blocking the whole release. Cap it at
        # 25 minutes so a stuck Windows leg fails fast instead of
        # holding macOS/Linux assets hostage.
        timeout-minutes: 25
        run: npm run build -- --target ${{ matrix.target }}

      # macOS: the app ships an unsigned Node sidecar, which breaks the
      # bundle's ad-hoc signature and makes Gatekeeper report "damaged".
      # Deep ad-hoc re-sign the whole .app (sidecar included) so it opens
      # (right-click Open, no "damaged" error). Full notarization needs a
      # paid Apple Developer cert — tracked separately.
      - name: Ad-hoc re-sign (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          APP=$(find src-tauri/target/${{ matrix.target }}/release/bundle/macos -maxdepth 1 -name '*.app' | head -1)
          if [ -n "$APP" ]; then
            echo "re-signing $APP"
            codesign --force --deep --sign - "$APP"
            codesign -dv "$APP" 2>&1 | head -4 || true
          fi

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p out
          BUNDLE=src-tauri/target/${{ matrix.target }}/release/bundle
          if [ "${{ runner.os }}" = "macOS" ]; then
            # Ship the re-signed .app as a zip (ditto preserves the
            # signature + symlinks). Skip the dmg — it embeds a copy of
            # the .app made before re-signing.
            APP=$(find "$BUNDLE/macos" -maxdepth 1 -name '*.app' | head -1)
            if [ -n "$APP" ]; then
              ditto -c -k --keepParent "$APP" "out/TianshuBridge-${{ matrix.target }}.app.zip"
            fi
          else
            # Only real installers. Restrict .exe to NSIS setup files
            # (…-setup.exe) so stray bundled exes (e.g. systray2's
            # tray_windows_release.exe under node_modules) don't leak in.
            find "$BUNDLE" -type f \
              \( -name '*.msi' -o -name '*-setup.exe' -o -name '*.AppImage' -o -name '*.deb' \) \
              -exec cp {} out/ \; || true
          fi
          ls -la out || true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bridge-desktop-${{ matrix.target }}
          path: out/*
          if-no-files-found: warn

  # Publish a GitHub Release from the collected artifacts. Runs only for
  # main pushes (→ continuous prerelease) and tags (→ stable release).
  #
  # Yu 2026-09-20 18:35: use `if: always()` + `github.event_name ==
  # 'push'` so this still runs when one matrix leg fails. With
  # `fail-fast: false` on the matrix, Linux and macOS often finish
  # successfully even if Windows stalls; we want their artifacts
  # published rather than gated on Windows.
  release:
    needs: build
    if: always() && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Flatten + checksums
        run: |
          mkdir -p out
          find dist -type f -exec cp {} out/ \;
          cd out
          ls -la
          sha256sum * > SHA256SUMS.txt || true
          cat SHA256SUMS.txt || true

      # main push → refresh the rolling "continuous" prerelease.
      - name: Publish continuous prerelease
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: continuous
          name: Continuous (latest main)
          prerelease: true
          # Replace the rolling release's assets on every build.
          files: out/*
          body: |
            Rolling build from the latest `main`. Unsigned / ad-hoc signed —
            see README for how to open on macOS (right-click → Open) and
            Windows (SmartScreen → Run anyway).

      # tag push → versioned stable release.
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: false
          files: out/*
