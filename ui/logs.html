<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tianshu Bridge — Logs</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #1a1a2e;
        --fg: #e5e7eb;
        --muted: #9ca3af;
        --border: #3f3f46;
        --accent: #3b82f6;
        --tray-color: #a78bfa;
        --bridge-color: #60a5fa;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #ffffff;
          --fg: #1a1a1a;
          --muted: #6b7280;
          --border: #e5e7eb;
          --tray-color: #7c3aed;
          --bridge-color: #2563eb;
        }
      }
      * { box-sizing: border-box; margin: 0; }
      body {
        font-family: "SF Mono", "Fira Code", "Cascadia Code", monospace;
        background: var(--bg);
        color: var(--fg);
        font-size: 12px;
        height: 100vh;
        display: flex;
        flex-direction: column;
      }
      .toolbar {
        display: flex;
        gap: 8px;
        padding: 10px 14px;
        border-bottom: 1px solid var(--border);
        align-items: center;
        flex-shrink: 0;
      }
      .toolbar input {
        flex: 1;
        padding: 6px 10px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--bg);
        color: var(--fg);
        font-size: 12px;
        font-family: inherit;
      }
      .toolbar button {
        padding: 6px 14px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--bg);
        color: var(--fg);
        font-size: 12px;
        cursor: pointer;
      }
      .toolbar button:hover { border-color: var(--accent); }
      .toolbar .count { color: var(--muted); font-size: 11px; white-space: nowrap; }
      .log-container {
        flex: 1;
        overflow-y: auto;
        padding: 8px 14px;
      }
      .log-entry {
        display: flex;
        gap: 10px;
        padding: 3px 0;
        line-height: 1.5;
        border-bottom: 1px solid color-mix(in srgb, var(--border) 30%, transparent);
      }
      .log-entry:hover { background: color-mix(in srgb, var(--accent) 8%, transparent); }
      .ts { color: var(--muted); white-space: nowrap; min-width: 110px; }
      .src { font-weight: 700; min-width: 50px; }
      .src.tray { color: var(--tray-color); }
      .src.bridge { color: var(--bridge-color); }
      .msg { word-break: break-all; flex: 1; }
      .empty { color: var(--muted); text-align: center; padding: 60px 0; font-size: 13px; }
      .highlight { background: #fbbf24; color: #000; border-radius: 2px; padding: 0 1px; }
    </style>
  </head>
  <body>
    <div class="toolbar">
      <input id="search" type="text" placeholder="Search logs…" autofocus />
      <button id="refresh">↻ Refresh</button>
      <span id="count" class="count"></span>
    </div>
    <div id="logContainer" class="log-container">
      <div class="empty">Loading…</div>
    </div>
    <script type="module" src="./logs.js"></script>
  </body>
</html>
