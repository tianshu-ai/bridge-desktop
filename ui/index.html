<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Tianshu Bridge — Settings</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #e2e8f0; font-size: 13px; padding: 16px; min-height: 100vh; }
    h2 { font-size: 15px; font-weight: 600; margin-bottom: 12px; color: #f1f5f9; }
    .profile-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
    .profile-card { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 12px; }
    .profile-card.running { border-color: #22c55e; }
    .profile-header { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .profile-name { font-weight: 600; flex: 1; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #64748b; flex-shrink: 0; }
    .status-dot.running { background: #22c55e; }
    .profile-server { font-size: 11px; color: #94a3b8; margin-bottom: 8px; }
    .profile-actions { display: flex; gap: 6px; }
    .btn { padding: 4px 12px; border-radius: 6px; border: 1px solid #475569; background: #1e293b; color: #e2e8f0; font-size: 11px; cursor: pointer; }
    .btn:hover { background: #334155; }
    .btn.primary { background: #3b82f6; border-color: #3b82f6; color: white; }
    .btn.primary:hover { background: #2563eb; }
    .btn.danger { color: #f87171; }
    .btn.danger:hover { background: #7f1d1d33; }
    .btn.green { background: #166534; border-color: #22c55e; }
    .btn.red { background: #7f1d1d; border-color: #ef4444; }

    /* Edit form */
    .edit-form { display: none; margin-top: 12px; padding-top: 12px; border-top: 1px solid #334155; }
    .edit-form.visible { display: block; }
    .form-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .form-row label { width: 100px; font-size: 11px; color: #94a3b8; flex-shrink: 0; }
    .form-row input[type="text"], .form-row select { flex: 1; background: #0f172a; border: 1px solid #334155; border-radius: 4px; color: #e2e8f0; padding: 4px 8px; font-size: 12px; }
    .form-row input[type="checkbox"] { width: 16px; height: 16px; }
    .checkbox-row { display: flex; align-items: center; gap: 6px; font-size: 12px; }

    .add-bar { display: flex; gap: 8px; margin-bottom: 16px; }
    .add-bar input { flex: 1; background: #0f172a; border: 1px solid #334155; border-radius: 6px; color: #e2e8f0; padding: 6px 10px; font-size: 12px; }

    .toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: #1e293b; border: 1px solid #475569; border-radius: 8px; padding: 8px 16px; font-size: 12px; opacity: 0; transition: opacity 0.2s; pointer-events: none; }
    .toast.visible { opacity: 1; }
    .toast.error { border-color: #ef4444; color: #f87171; }

    .footer { display: flex; gap: 8px; justify-content: flex-end; padding-top: 12px; border-top: 1px solid #1e293b; }
  </style>
</head>
<body>
  <h2>Tianshu Bridge — Profiles</h2>

  <div class="add-bar">
    <input id="newServer" type="text" placeholder="wss://server.example.com/ws" />
    <button class="btn primary" id="addBtn">+ Add Profile</button>
  </div>

  <div id="profileList" class="profile-list"></div>

  <div class="footer">
    <button class="btn" id="pasteBtn">📋 Paste Config</button>
    <button class="btn" id="hideBtn">Close</button>
  </div>

  <div id="toast" class="toast"></div>

  <script src="main.js"></script>
</body>
</html>
